services:
  - type: web
    name: sbar-handover
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/sbar.db
      - key: UI_DIST
        value: /app/ui
      - key: CORS_ORIGINS
        value: "*"
      - key: HOSPITAL_NAME
        value: All India Institute of Medical Sciences (AIIMS) - Bibinagar, Hyderabad
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
